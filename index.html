<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>Move · Workout exercises</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20231f;
        background: #f5f4f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(ellipse at 12% 0%, rgb(221 231 204 / 55%), transparent 34rem),
          #f5f4f0;
      }

      .app {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #718067;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 3.6rem);
        font-weight: 720;
        letter-spacing: -0.075em;
        line-height: 0.95;
      }

      .subtitle {
        margin: 12px 0 0;
        color: #777a72;
        font-size: 0.94rem;
      }

      .lists {
        display: grid;
        gap: 12px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .workout-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        width: 100%;
        max-width: 100%;
        min-height: 112px;
        padding: 16px 18px;
        border: 1px solid #e2e4dc;
        border-radius: 12px;
        background: rgb(255 255 255 / 85%);
        box-shadow: 0 2px 6px rgb(35 40 29 / 3%);
        transition: border-color 170ms ease, background 170ms ease, box-shadow 170ms ease;
      }

      .workout-list:hover {
        border-color: #cbd4bf;
        background: #fff;
        box-shadow: 0 8px 18px rgb(35 40 29 / 7%);
      }

      .list-move {
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: #718067;
        font: inherit;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-align: left;
        text-transform: uppercase;
        cursor: pointer;
      }

      .list-move:focus-visible,
      .workout-entry:focus-visible {
        outline: 3px solid #a6bb8d;
        outline-offset: 3px;
      }

      .workout-names {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px 16px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .workout-entry {
        width: 100%;
        min-height: 32px;
        padding: 4px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 160ms ease;
      }

      .workout-entry:hover {
        background: #f0f3eb;
      }

      .workout-name {
        font-size: 0.98rem;
        font-weight: 680;
        overflow-wrap: anywhere;
      }

      .hint {
        margin: 18px 4px 0;
        color: #898b84;
        font-size: 0.8rem;
        text-align: center;
      }

      .status {
        min-height: 1.2em;
        margin: 10px 0 0;
        color: #a14436;
        font-size: 0.8rem;
        text-align: center;
      }

      @media (max-width: 420px) {
        body {
          padding: 34px 16px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <ol class="lists" id="workout-lists" aria-label="Workout lists"></ol>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const exercises = [
        "Ring Pull-ups",
        "Ring Dips",
        "Ring Pike Push-ups",
        "Ring Rows",
        "Ring Face-pulls",
        "Ring Lateral-raises",
        "Ring Pelican-curls",
        "Ring Tricep-extensions",
        "Single-leg Squats",
        "Single-leg Deadlifts",
        "Push Kicks",
        "Low Kicks",
        "Calf Raises",
        "Wrist Raises",
        "Calf Pulls",
        "Wrist Pulls",
      ];
      const storageKey = "workout-exercise-order";
      const list = document.querySelector("#workout-lists");
      const status = document.querySelector("#status");
      const exerciseIds = new Set(exercises);
      const activeAnimations = new WeakMap();

      function readOrder() {
        let savedOrder;

        try {
          savedOrder = JSON.parse(localStorage.getItem(storageKey));
        } catch (error) {
          status.textContent = "Could not read your saved order. The default order is shown.";
          return exercises;
        }

        if (
          !Array.isArray(savedOrder)
          || savedOrder.length !== exercises.length
          || savedOrder.some((id) => !exerciseIds.has(id))
          || new Set(savedOrder).size !== exercises.length
        ) {
          return exercises;
        }

        return savedOrder;
      }

      const savedOrder = readOrder();
      let workoutLists = Array.from({ length: 4 }, (_, index) => ({
        id: `workout-list-${index}`,
        workouts: savedOrder.slice(index * 4, index * 4 + 4),
      }));

      function saveOrder() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(workoutLists.flatMap(({ workouts }) => workouts)));
          status.textContent = "";
        } catch (error) {
          status.textContent = "Could not save your order. Check your browser's storage settings.";
        }
      }

      function capturePositions() {
        const positions = new Map();
        for (const item of list.children) {
          const listTop = item.getBoundingClientRect().top;
          positions.set(`list:${item.dataset.listId}`, listTop);
          activeAnimations.get(item)?.cancel();
          for (const workout of item.querySelectorAll(".workout-entry")) {
            positions.set(
              `workout:${workout.dataset.exerciseId}`,
              workout.getBoundingClientRect().top - listTop,
            );
            activeAnimations.get(workout)?.cancel();
          }
        }
        return positions;
      }

      function animateMovement(element, key, previousPositions, currentTop, prefersReducedMotion) {
        const previousTop = previousPositions.get(key);
        if (previousTop === undefined) {
          return;
        }

        const offset = previousTop - currentTop;
        if (offset !== 0) {
          const keyframes = prefersReducedMotion
            ? [{ opacity: 0.55 }, { opacity: 1 }]
            : [{ transform: `translateY(${offset}px)` }, { transform: "translateY(0)" }];
          const animation = element.animate(
            keyframes,
            { duration: prefersReducedMotion ? 180 : 700, easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
          );
          activeAnimations.set(element, animation);
        }
      }

      function render(previousPositions = null) {
        const existingLists = new Map(
          [...list.children].map((item) => [item.dataset.listId, item]),
        );

        workoutLists.forEach((workoutList, index) => {
          let item = existingLists.get(workoutList.id);

          if (!item) {
            item = document.createElement("li");
            const card = document.createElement("section");
            const heading = document.createElement("button");
            const names = document.createElement("ol");

            card.className = "workout-list";
            heading.className = "list-move";
            heading.type = "button";
            names.className = "workout-names";
            heading.addEventListener("click", () => moveListToEnd(workoutList.id));
            card.addEventListener("click", (event) => {
              if (!event.target.closest("button")) {
                moveListToEnd(workoutList.id);
              }
            });
            card.append(heading, names);
            item.append(card);
          }

          item.dataset.listId = workoutList.id;
          const card = item.firstElementChild;
          const heading = card.firstElementChild;
          const names = card.lastElementChild;
          heading.textContent = `Workout list ${index + 1}`;
          heading.setAttribute(
            "aria-label",
            `Move workout list ${index + 1} to the end: ${workoutList.workouts.join(", ")}`,
          );
          const existingWorkouts = new Map(
            [...names.children].map((workout) => [workout.dataset.exerciseId, workout]),
          );
          workoutList.workouts.forEach((workout) => {
            let workoutItem = existingWorkouts.get(workout);
            if (!workoutItem) {
              workoutItem = document.createElement("li");
              const button = document.createElement("button");
              const name = document.createElement("span");

              button.className = "workout-entry";
              button.type = "button";
              button.dataset.exerciseId = workout;
              button.addEventListener("click", () => moveWorkoutToEnd(workoutList.id, workout));
              name.className = "workout-name";
              button.append(name);
              workoutItem.append(button);
              workoutItem.dataset.exerciseId = workout;
            }

            const button = workoutItem.firstElementChild;
            button.setAttribute("aria-label", `Move ${workout} to the bottom of this list`);
            button.firstElementChild.textContent = workout;
            names.append(workoutItem);
          });
          list.append(item);
        });

        if (previousPositions) {
          const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          for (const item of list.children) {
            const listTop = item.getBoundingClientRect().top;
            animateMovement(item, `list:${item.dataset.listId}`, previousPositions, listTop, prefersReducedMotion);
            for (const workout of item.querySelectorAll(".workout-entry")) {
              const relativeTop = workout.getBoundingClientRect().top - listTop;
              animateMovement(
                workout,
                `workout:${workout.dataset.exerciseId}`,
                previousPositions,
                relativeTop,
                prefersReducedMotion,
              );
            }
          }
        }
      }

      function moveListToEnd(listId) {
        const currentIndex = workoutLists.findIndex(({ id }) => id === listId);
        if (currentIndex === workoutLists.length - 1) {
          return;
        }

        const previousPositions = capturePositions();
        const [movedList] = workoutLists.splice(currentIndex, 1);
        workoutLists.push(movedList);
        saveOrder();
        render(previousPositions);
      }

      function moveWorkoutToEnd(listId, workout) {
        const listIndex = workoutLists.findIndex(({ id }) => id === listId);
        const workoutList = workoutLists.find(({ id }) => id === listId);
        const currentIndex = workoutList.workouts.indexOf(workout);
        const workoutIsLast = currentIndex === workoutList.workouts.length - 1;
        const listIsLast = listIndex === workoutLists.length - 1;
        if (workoutIsLast && listIsLast) {
          return;
        }

        const previousPositions = capturePositions();
        if (!workoutIsLast) {
          const [movedWorkout] = workoutList.workouts.splice(currentIndex, 1);
          workoutList.workouts.push(movedWorkout);
        }
        if (!listIsLast) {
          const [movedList] = workoutLists.splice(listIndex, 1);
          workoutLists.push(movedList);
        }
        saveOrder();
        render(previousPositions);
      }

      render();
    </script>
  </body>
</html>

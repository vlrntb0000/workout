<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>Move · Workout exercises</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20231f;
        background: #f5f4f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(ellipse at 12% 0%, rgb(221 231 204 / 55%), transparent 34rem),
          #f5f4f0;
      }

      .app {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #718067;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 3.6rem);
        font-weight: 720;
        letter-spacing: -0.075em;
        line-height: 0.95;
      }

      .subtitle {
        margin: 12px 0 0;
        color: #777a72;
        font-size: 0.94rem;
      }

      .undo {
        display: block;
        flex: 0 0 auto;
        min-height: 42px;
        margin: 28px auto 0;
        padding: 0 15px;
        border: 1px solid #dcded6;
        border-radius: 999px;
        background: rgb(255 255 255 / 68%);
        color: #343831;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 650;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease, opacity 160ms ease;
      }

      .undo:hover:not(:disabled) {
        border-color: #b7c2a8;
        background: #fff;
      }

      .undo:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .list {
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .exercise {
        display: flex;
        align-items: center;
        width: fit-content;
        max-width: 100%;
        min-height: 76px;
        padding: 12px 17px;
        border: 1px solid #e8e8e1;
        border-radius: 18px;
        background: rgb(255 255 255 / 85%);
        text-align: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgb(35 40 29 / 3%);
        transition: transform 170ms ease, border-color 170ms ease, background 170ms ease, box-shadow 170ms ease;
        animation: arrive 220ms ease both;
      }

      .exercise:hover {
        transform: translateY(-2px);
        border-color: #cbd4bf;
        background: #fff;
        box-shadow: 0 8px 18px rgb(35 40 29 / 7%);
      }

      .exercise:focus-visible,
      .undo:focus-visible {
        outline: 3px solid #a6bb8d;
        outline-offset: 3px;
      }

      .name {
        font-size: 0.98rem;
        font-weight: 680;
        letter-spacing: -0.025em;
      }

      .hint {
        margin: 18px 4px 0;
        color: #898b84;
        font-size: 0.8rem;
        text-align: center;
      }

      .status {
        min-height: 1.2em;
        margin: 10px 0 0;
        color: #a14436;
        font-size: 0.8rem;
        text-align: center;
      }

      @keyframes arrive {
        from {
          transform: translateY(7px);
          opacity: 0.5;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 420px) {
        body {
          padding: 34px 16px;
        }

        .undo {
          min-height: 38px;
          padding: 0 12px;
          font-size: 0.8rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <ol class="list" id="exercise-list" aria-label="Workout exercises"></ol>
      <button class="undo" id="undo" type="button" disabled>↶</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const exercises = [
        "Ring Pull-ups",
        "Ring Dips",
        "Ring Pike Push-ups",
        "Ring Rows",
        "Ring Face-pulls",
        "Ring Lateral-raises",
        "Ring Pelican-curls",
        "Ring Tricep-extensions",
        "Single-leg Squats",
        "Single-leg Deadlifts",
        "Push Kicks",
        "Low Kicks",
        "Calf Raises",
        "Wrist Raises",
        "Calf Pulls",
        "Wrist Pulls",
      ];
      const storageKey = "workout-exercise-order";
      const list = document.querySelector("#exercise-list");
      const undoButton = document.querySelector("#undo");
      const status = document.querySelector("#status");
      const exerciseIds = new Set(exercises);
      const undoHistory = [];
      const activeAnimations = new WeakMap();

      function readOrder() {
        let savedOrder;

        try {
          savedOrder = JSON.parse(localStorage.getItem(storageKey));
        } catch (error) {
          status.textContent = "Could not read your saved order. The default order is shown.";
          return exercises;
        }

        if (
          !Array.isArray(savedOrder)
          || savedOrder.length !== exercises.length
          || savedOrder.some((id) => !exerciseIds.has(id))
          || new Set(savedOrder).size !== exercises.length
        ) {
          return exercises;
        }

        return savedOrder;
      }

      let order = readOrder();

      function saveOrder() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(order));
          status.textContent = "";
        } catch (error) {
          status.textContent = "Could not save your order. Check your browser's storage settings.";
        }
      }

      function capturePositions() {
        const positions = new Map();
        for (const item of list.children) {
          positions.set(item.dataset.exerciseId, item.getBoundingClientRect());
          activeAnimations.get(item)?.cancel();
        }
        return positions;
      }

      function render(previousPositions = null) {
        const existingItems = new Map(
          [...list.children].map((item) => [item.dataset.exerciseId, item]),
        );

        order.forEach((id) => {
          let item = existingItems.get(id);

          if (!item) {
            item = document.createElement("li");
            const button = document.createElement("button");
            const name = document.createElement("span");

            button.className = "exercise";
            button.type = "button";
            button.setAttribute("aria-label", `Move ${id} to the end of the list`);
            name.className = "name";
            name.textContent = id;
            button.append(name);
            button.addEventListener("click", () => moveToEnd(id));
            item.append(button);
            item.dataset.exerciseId = id;
          } else {
            const button = item.firstElementChild;
            button.setAttribute("aria-label", `Move ${id} to the end of the list`);
          }

          list.append(item);
        });

        undoButton.disabled = undoHistory.length === 0;

        if (previousPositions && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          for (const item of list.children) {
            const previous = previousPositions.get(item.dataset.exerciseId);
            if (!previous) {
              continue;
            }

            const current = item.getBoundingClientRect();
            const offset = previous.top - current.top;
            if (offset !== 0) {
              const animation = item.animate(
                [{ transform: `translateY(${offset}px)` }, { transform: "translateY(0)" }],
                { duration: 850, easing: "cubic-bezier(0.65, 0, 0.35, 1)" },
              );
              activeAnimations.set(item, animation);
            }
          }
        }
      }

      function moveToEnd(id) {
        const currentIndex = order.indexOf(id);
        if (currentIndex === order.length - 1) {
          return;
        }

        undoHistory.push([...order]);
        if (undoHistory.length > 4) {
          undoHistory.shift();
        }
        const previousPositions = capturePositions();
        order = [...order.slice(0, currentIndex), ...order.slice(currentIndex + 1), id];
        saveOrder();
        render(previousPositions);
      }

      undoButton.addEventListener("click", () => {
        const previousOrder = undoHistory.pop();
        if (!previousOrder) {
          return;
        }
        const previousPositions = capturePositions();
        order = previousOrder;
        saveOrder();
        render(previousPositions);
      });

      render();
    </script>
  </body>
</html>

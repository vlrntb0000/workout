<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>Move · Workout exercises</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20231f;
        background: #f5f4f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(ellipse at 12% 0%, rgb(221 231 204 / 55%), transparent 34rem),
          #f5f4f0;
      }

      .app {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #718067;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 9vw, 3.6rem);
        font-weight: 720;
        letter-spacing: -0.075em;
        line-height: 0.95;
      }

      .subtitle {
        margin: 12px 0 0;
        color: #777a72;
        font-size: 0.94rem;
      }

      .undo {
        flex: 0 0 auto;
        min-height: 42px;
        padding: 0 15px;
        border: 1px solid #dcded6;
        border-radius: 999px;
        background: rgb(255 255 255 / 68%);
        color: #343831;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 650;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease, opacity 160ms ease;
      }

      .undo:hover:not(:disabled) {
        border-color: #b7c2a8;
        background: #fff;
      }

      .undo:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .list {
        display: grid;
        gap: 10px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .exercise {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        min-height: 76px;
        padding: 12px 17px;
        border: 1px solid #e8e8e1;
        border-radius: 18px;
        background: rgb(255 255 255 / 85%);
        text-align: left;
        cursor: pointer;
        box-shadow: 0 2px 6px rgb(35 40 29 / 3%);
        transition: transform 170ms ease, border-color 170ms ease, background 170ms ease, box-shadow 170ms ease;
        animation: arrive 220ms ease both;
      }

      .exercise:hover {
        transform: translateY(-2px);
        border-color: #cbd4bf;
        background: #fff;
        box-shadow: 0 8px 18px rgb(35 40 29 / 7%);
      }

      .exercise:focus-visible,
      .undo:focus-visible {
        outline: 3px solid #a6bb8d;
        outline-offset: 3px;
      }

      .number {
        display: grid;
        flex: 0 0 38px;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: #f0f1eb;
        color: #72796b;
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }

      .exercise:nth-child(4n + 1) .number {
        background: #edf2e6;
        color: #61754f;
      }

      .exercise:nth-child(4n + 2) .number {
        background: #f4eee5;
        color: #987751;
      }

      .exercise:nth-child(4n + 3) .number {
        background: #e9f0ef;
        color: #53766e;
      }

      .exercise:nth-child(4n) .number {
        background: #f2eaf0;
        color: #88687f;
      }

      .details {
        display: grid;
        gap: 4px;
      }

      .name {
        font-size: 0.98rem;
        font-weight: 680;
        letter-spacing: -0.025em;
      }

      .category {
        color: #85877f;
        font-size: 0.76rem;
      }

      .move-icon {
        margin-left: auto;
        color: #a1a39b;
        font-size: 1.15rem;
        transition: transform 170ms ease, color 170ms ease;
      }

      .exercise:hover .move-icon {
        transform: translateY(3px);
        color: #718067;
      }

      .hint {
        margin: 18px 4px 0;
        color: #898b84;
        font-size: 0.8rem;
        text-align: center;
      }

      .status {
        min-height: 1.2em;
        margin: 10px 0 0;
        color: #a14436;
        font-size: 0.8rem;
        text-align: center;
      }

      @keyframes arrive {
        from {
          transform: translateY(7px);
          opacity: 0.5;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 420px) {
        body {
          padding: 34px 16px;
        }

        header {
          align-items: flex-start;
        }

        .undo {
          min-height: 38px;
          padding: 0 12px;
          font-size: 0.8rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">Your workout</p>
          <h1>Exercises</h1>
          <p class="subtitle">Tap an exercise to move it to the end.</p>
        </div>
        <button class="undo" id="undo" type="button" disabled>↶ Undo</button>
      </header>

      <ol class="list" id="exercise-list" aria-label="Workout exercises"></ol>
      <p class="hint">Your order is saved automatically.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const exercises = [
        { id: "squats", name: "Squats", category: "Lower body · Quads & glutes" },
        { id: "push-ups", name: "Push-ups", category: "Upper body · Chest & triceps" },
        { id: "lunges", name: "Reverse lunges", category: "Lower body · Balance & control" },
        { id: "plank", name: "Plank", category: "Core · Stability" },
        { id: "glute-bridges", name: "Glute bridges", category: "Lower body · Glutes" },
        { id: "shoulder-press", name: "Shoulder press", category: "Upper body · Shoulders" },
        { id: "dead-bugs", name: "Dead bugs", category: "Core · Coordination" },
        { id: "calf-raises", name: "Calf raises", category: "Lower body · Calves" },
      ];
      const storageKey = "workout-exercise-order";
      const list = document.querySelector("#exercise-list");
      const undoButton = document.querySelector("#undo");
      const status = document.querySelector("#status");
      const exerciseById = new Map(exercises.map((exercise) => [exercise.id, exercise]));
      const undoHistory = [];

      function readOrder() {
        let savedOrder;

        try {
          savedOrder = JSON.parse(localStorage.getItem(storageKey));
        } catch (error) {
          status.textContent = "Could not read your saved order. The default order is shown.";
          return exercises.map((exercise) => exercise.id);
        }

        if (!Array.isArray(savedOrder)) {
          return exercises.map((exercise) => exercise.id);
        }

        const validIds = savedOrder.filter(
          (id, index) => exerciseById.has(id) && savedOrder.indexOf(id) === index,
        );
        const savedIds = new Set(validIds);
        return [...validIds, ...exercises.map((exercise) => exercise.id).filter((id) => !savedIds.has(id))];
      }

      let order = readOrder();

      function saveOrder() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(order));
          status.textContent = "";
        } catch (error) {
          status.textContent = "Could not save your order. Check your browser's storage settings.";
        }
      }

      function render() {
        list.replaceChildren(
          ...order.map((id, index) => {
            const exercise = exerciseById.get(id);
            const item = document.createElement("li");
            const button = document.createElement("button");
            const number = document.createElement("span");
            const details = document.createElement("span");
            const name = document.createElement("span");
            const category = document.createElement("span");
            const moveIcon = document.createElement("span");

            button.className = "exercise";
            button.type = "button";
            button.setAttribute("aria-label", `Move ${exercise.name} to the end of the list`);
            number.className = "number";
            number.setAttribute("aria-hidden", "true");
            number.textContent = String(index + 1).padStart(2, "0");
            details.className = "details";
            name.className = "name";
            name.textContent = exercise.name;
            category.className = "category";
            category.textContent = exercise.category;
            moveIcon.className = "move-icon";
            moveIcon.setAttribute("aria-hidden", "true");
            moveIcon.textContent = "↓";
            details.append(name, category);
            button.append(number, details, moveIcon);
            button.addEventListener("click", () => moveToEnd(id));
            item.append(button);
            return item;
          }),
        );
        undoButton.disabled = undoHistory.length === 0;
      }

      function moveToEnd(id) {
        const currentIndex = order.indexOf(id);
        if (currentIndex === order.length - 1) {
          return;
        }

        undoHistory.push([...order]);
        if (undoHistory.length > 4) {
          undoHistory.shift();
        }
        order = [...order.slice(0, currentIndex), ...order.slice(currentIndex + 1), id];
        saveOrder();
        render();
      }

      undoButton.addEventListener("click", () => {
        const previousOrder = undoHistory.pop();
        if (!previousOrder) {
          return;
        }
        order = previousOrder;
        saveOrder();
        render();
      });

      render();
    </script>
  </body>
</html>
